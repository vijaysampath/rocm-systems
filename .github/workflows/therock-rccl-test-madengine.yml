name: TheRock Test MADEngine Workloads for rccl

on:
  workflow_call:
    inputs:
      amdgpu_families:
        type: string
      artifact_group:
        type: string
      test_runs_on:
        type: string
      artifact_run_id:
        type: string
      workload:
        type: string
        default: 'llama-3.1-70b-training'
      nodes:
        type: string
        default: '2'
      notify_email:
        type: string
        default: ''
      teams_webhook:
        type: string
        default: ''
  workflow_dispatch:
    inputs:
      amdgpu_families:
        type: string
      artifact_group:
        type: string
      test_runs_on:
        type: string
        default: 'ruby-linux-slurm-scale-runner'
      artifact_run_id:
        description: 'Reuse artifacts from a previous build run ID'
        type: string
      workload:
        description: 'MADEngine workload to run'
        type: string
        default: 'llama-3.1-70b-training'
      nodes:
        description: 'Number of SLURM nodes to allocate'
        type: string
        default: '2'
      notify_email:
        description: 'Email address to send test summary report'
        type: string
        default: ''
      teams_webhook:
        description: 'Teams webhook URL for notifications'
        type: string
        default: ''

permissions:
  contents: read
  packages: write

jobs:
  test_madengine:
    name: 'Test MADEngine ${{ inputs.workload }} (${{ inputs.nodes }}N)'
    runs-on: ${{ inputs.test_runs_on }}
    defaults:
      run:
        shell: bash
    steps:
      - name: Re-check docker on compute nodes
        run: |
          set +e
          echo "runner host: $(hostname -s)"
          timeout 900 srun -N8 --ntasks-per-node=1 -p meta64 -t 2 \
            --job-name=recheck bash -c '
              if docker ps >/dev/null 2>&1; then v=OK; else v=DENIED; fi;
              printf "  %-24s sock=%-34s gids=%s docker=%s\n" "$(hostname -s)" "$(stat -c "%G(%g)" /var/run/docker.sock 2>&1)" "$(id -G | tr " " ",")" "$v";
            ' 2>&1 | sort | head -12
          exit 0
